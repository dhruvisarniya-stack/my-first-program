
<!DOCTYPE html>
<html>
<head>
    <title>Rowspan Table</title>
    <style>
        table {
            width: 600px;
            height: 400px;
            border-collapse: collapse;
        }

        td {
            border: 2px solid black;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td rowspan="3"></td>
            <td> </td>
        </tr>

        <tr>
            <td> </td>
        </tr>

        <tr>
            <td> </td>
        </tr>
    </table>

</body>
</html>
